workflows:
  default-workflow:
    name: Default Workflow
    instance_type: linux
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Build Flutter Web
        script: |
          flutter pub get
          flutter build web --release
    artifacts:
      - build/web/**  # 关键：告诉 Codemagic 把 web 文件夹打包成产物
    publishing:
      codemagic_static_pages:
        enabled: true
        subdomain: troll-demo-xxx  # 随便写个名字，比如 troll-demo-你的名字
