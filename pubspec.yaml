workflows:
  web_build:
    name: Web Build
    instance_type: linux
    max_build_duration: 30
    environment:
      flutter: 3.24.0  # 锁定一个稳定版本，避免自动升版炸
    scripts:
      - name: Clean
        script: flutter clean
      - name: Get dependencies
        script: flutter pub get --no-cache  # 不读缓存，强制重新拉
      - name: Build web
        script: flutter build web --release
    artifacts:
      - build/web/**
    publishing:
      codemagic_static_pages:
        enabled: true
        subdomain: troll-flutter-demo-2026
